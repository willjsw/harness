# 머지 전 검증. 하네스가 **처음 설치할 때 한 번만** 깔고 그 뒤로는 프로젝트 것이다 —
# render 가 덮지 않고 uninstall 도 지우지 않는다. 마음대로 고친다.
#
# 여기서 도는 것은 `script/run-lint-test.sh` 하나다. 무엇을 검증할지는 `harness.toml` 의
# `[commands]`·`[verify]` 가 갖는다 — CI 설정에 검증 내용을 복사하지 않는다.
#
# 언어 런타임을 더 깔아야 하면 아래 steps 에 더한다 (JDK·Node·Go 등).
# 모노레포에서 하네스가 하위 디렉터리에 있으면 이 파일을 **리포 루트로 옮기고**
# `defaults.run.working-directory` 를 그 경로로 맞춘다 — GitHub 은 리포 루트의
# `.github/workflows/` 만 읽는다.
name: harness verify

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run-lint-test
        run: script/run-lint-test.sh

  # main 에 push 되면 검증을 통과한 커밋을 GitHub Release 로 낸다. Homebrew 포뮬러가 main 을 설치하므로
  # main 의 커밋 하나가 곧 배포 단위다. 태그는 `harness version` 과 같은 `v<번호>+<커밋 7자리>` 다.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(src/bin/harness version | sed -n 's/^harness //p')
          case "$version" in
            *+*-dirty|"") echo "error: cannot release version '$version'" >&2; exit 1 ;;
            *+*) ;;
            *) echo "error: version '$version' carries no source commit" >&2; exit 1 ;;
          esac
          tag="v$version"
          # 같은 커밋을 다시 돌리면 이미 있는 릴리스를 그대로 둔다
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
