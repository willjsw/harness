# 하네스 설정 정본.
#
# **하네스에 관한 값은 전부 여기 있다.** 규칙 문서·훅·권한 파일·에이전트 정의는
# 이 파일에서 생성되므로, 값을 바꿀 때 고치는 곳은 이 파일 하나다.
#
#   harness render      설정 → 생성 파일
#   harness check       생성 파일이 설정과 일치하는지 (pre-commit 이 부른다)
#
# 생성된 파일을 직접 고치지 않는다. 고쳐도 다음 render 가 덮고, check 가 커밋을 막는다.

[harness]
version = "0.1.0"

# 워크플로를 실제로 도는 세션. roles.*.runner 가 "inproc" 인 역할은 이 값으로 실행된다.
#   claude | codex
orchestrator = "claude"

# 오케스트레이터의 모델. 비우면 그 CLI 의 기본 모델이다.
# runner 가 오케스트레이터와 같은 CLI 인 역할은 이 모델만 쓴다(그 역할의 roles.*.model 은 쓰이지 않는다).
# 서브에이전트(inproc) 역할은 roles.*.model 을 쓰고, 비우면 이 모델을 이어받는다.
model = ""

[project]
name = "harness"

# ─────────────────────────────────────────────────────────────────────────────
# 브랜치
# ─────────────────────────────────────────────────────────────────────────────
[branches]
# MR·PR 을 보내는 브랜치. 승인 게이트(분해·명세 조회)의 기준 ref 이기도 하다.
base = "main"

# 직접 push 를 막을 브랜치. base 는 적지 않아도 자동으로 들어간다 —
# 거기로 직접 push 할 수 있으면 승인 게이트가 우회된다.
protected = ["main"]

# ─────────────────────────────────────────────────────────────────────────────
# 커밋
# ─────────────────────────────────────────────────────────────────────────────
[commit]
tags = ["feat", "fix", "docs", "chore", "refactor"]

# 이슈 번호를 제목 어디에 붙이나.
#   suffix  →  feat: 요약(#123)
#   prefix  →  [BD-123] feat: 요약        (ticket_key 필요)
issue_ref = "suffix"
ticket_key = ""

# ─────────────────────────────────────────────────────────────────────────────
# 리뷰 루프
# ─────────────────────────────────────────────────────────────────────────────
[review]
# 한 MR 을 몇 회차까지 리뷰하나. 닿으면 리뷰를 수행하지 않고 사람에게 넘긴다.
max_rounds = 5

# 한 파일에 blocker·major 가 몇 회차 연속 나오면 멈추나.
# 코드가 아니라 명세가 틀렸다는 신호다.
repeat_file_max = 3

# 회차를 세는 MR 라벨의 접두. 라벨은 `<prefix>:<N>` 형식이 된다.
round_label = "mrl"

# ─────────────────────────────────────────────────────────────────────────────
# 역할
# ─────────────────────────────────────────────────────────────────────────────
# runner  inproc = 오케스트레이터 세션의 서브에이전트 · claude|codex = 그 CLI 로 따로 띄움
#         고를 수 있는 CLI 는 하네스의 벤더 선언(templates/vendors.toml)이 정한다
# access  read-only | write   (tools 를 적지 않으면 여기서 도구 목록이 나온다)
# model   비우면 러너의 기본 모델. CLI 러너는 적어 두는 편이 재현 가능하다

[roles.requirement-analyzer]
runner = "inproc"
access = "read-only"
tools = ["Read", "Grep", "Glob", "Bash"]   # 조회용 Bash 를 더한다. 파일은 쓰지 않는다

[roles.spec-writer]
runner = "inproc"
access = "write"

[roles.planner]
runner = "inproc"
access = "write"

[roles.developer]
runner = "inproc"
access = "write"

[roles.code-reviewer]
runner = "codex"
access = "read-only"
model = ""

[roles.docs-writer]
runner = "inproc"
access = "write"

# 변경분을 보안 관점 하나로만 읽는다. 코드 리뷰와 겹치지 않게 렌즈를 나눈 배치다.
[roles.security-guard]
runner = "inproc"
access = "read-only"

# ─────────────────────────────────────────────────────────────────────────────
# 명령
# ─────────────────────────────────────────────────────────────────────────────
# 실제로 도는 명령만 적는다 — 에이전트가 이 명령으로 구현이 끝났는지 확인한다.
# 규칙 문서(AI_AGENT.md 3장)와 검증 스크립트(script/harness-verify.sh)가 여기서 생성된다.
# **format_check 와 test 는 커밋 뒤와 CI 에서 실행된다.** 비워 두면 검증이 "아직 정하지 않음" 으로 멈춘다.
[commands]
build = ""
test = "src/test/render-test.sh"
test_single = ""
format_check = ""
format_fix = ""

# 명령 하나로 표현하는 추가 검사. 코드 검사·테스트보다 먼저, 적은 순서대로 돈다.
# 계층 의존 규칙처럼 문서에만 적으면 아무도 돌리지 않는 검사를 여기 둔다. 여러 줄이면 스크립트로 빼서 부른다.
#   checks = [
#     { name = "domain 이 프레임워크를 import 하지 않는다", run = "! grep -rnE '^import (org\\.springframework|lombok)\\.' src/main/java/domain/" },
#     { name = "모듈 경계", run = "script/check-deps.sh" },
#   ]
[verify]
checks = [
  { name = "CLI 가 컴파일된다", run = "python3 -m py_compile src/bin/harness" },
  { name = "UI 단위 테스트", run = "cd src/ui && node --test lib/*.test.js" },
]

# ─────────────────────────────────────────────────────────────────────────────
# 실행 지표 (Metrics 탭)
# ─────────────────────────────────────────────────────────────────────────────
# 명령·단계·에이전트·스크립트마다 시간·토큰·상태를 남긴다. 리포 밖에 남아 커밋되지 않는다.
# 프롬프트·명령줄·문서 본문은 남기지 않는다. 실패 로그는 capture_logs = "errors" 일 때 실패한 것의
# 끝부분만, 토큰·쿠키·이메일·홈 경로를 지운 뒤 남긴다.
#   dir  "off" 면 기록하지 않는다
[metrics]
dir = "$HOME/.harness/{project}/metrics"
retention_days = 30      # 이보다 오래된 파일은 지운다
max_file_mb = 10         # 파일 하나가 이만큼 차면 새 파일로 넘어간다
max_total_mb = 100       # 전체가 이만큼을 넘으면 오래된 파일부터 지운다
stale_after_hours = 6    # 끝 기록 없이 이만큼 지난 실행은 중단된 것으로 본다 (실패로 세지 않는다)
capture_logs = "errors"  # errors | off

[invariants]
# 구현한 쪽과 리뷰하는 쪽의 러너가 같으면 render 를 거부한다.
# 어느 역할끼리 달라야 하는지는 역할 선언(templates/agents/<역할>.md 의 distinct_from)이 정한다.
# 같은 모델이 자기 코드를 리뷰하면 같은 맹점을 두 번 지나간다.
distinct_reviewer = true

# ─────────────────────────────────────────────────────────────────────────────
# forge (이슈 추적 · 코드 리뷰 호스트)
# ─────────────────────────────────────────────────────────────────────────────
[forge]
# 둘을 따로 고른다. Jira 로 이슈를 관리하면서 GitHub 에서 리뷰할 수 있다.
#   tracker      gitlab | github | jira
#   review_host  gitlab | github
tracker = "github"
review_host = "github"

# ─────────────────────────────────────────────────────────────────────────────
# 이슈
# ─────────────────────────────────────────────────────────────────────────────
[issues]
# 만들 이슈에 붙일 라벨. 트래커에 라벨 개념이 없으면 어댑터가 자기 개념으로 옮긴다.
labels = { requirement = "Requirement", task = "Task", invalid = "invalid" }

# 되감을 때 옮길 상태 이름. **일반적인 "닫기" 가 없는 트래커(Jira)만 쓴다.**
# 프로젝트의 전이 이름과 정확히 같아야 한다.
closed_status = "Done"

# 만들 이슈의 유형. **유형 개념이 있는 트래커(Jira)만 쓴다** — 라벨만 있는 트래커는 무시한다.
# 프로젝트의 유형 이름과 정확히 같아야 한다 (한국어 프로젝트면 "작업" 처럼 다를 수 있다).
type = "Task"

# 이슈를 만들 때 반드시 채워야 하는 필드. 상위 이슈에서 물려받지 못하면 만들지 않는다.
# 빈 목록이면 검사하지 않는다.
required_fields = ["assignee"]

# 참이면 잘못 만든 이슈를 지울 수 없다는 전제로 돈다 — 만들기 전 검사가 엄격해지고
# 가드가 삭제 명령을 막는다.
deletion_forbidden = true

# ─────────────────────────────────────────────────────────────────────────────
# 리뷰 요청
# ─────────────────────────────────────────────────────────────────────────────
[mr]
# self 면 현재 사용자. 계정명을 적으면 그 사람으로 지정한다.
default_assignee = "self"
default_reviewer = "self"

# ─────────────────────────────────────────────────────────────────────────────
# ADR
# ─────────────────────────────────────────────────────────────────────────────
[adr]
# nygard | madr | none
style = "nygard"

# adr-tools | adrs | manual | none
tool = "manual"

dir = "docs/adr"

# ─────────────────────────────────────────────────────────────────────────────
# 문서
# ─────────────────────────────────────────────────────────────────────────────
[docs]
# 에이전트가 근거로 읽는 문서. 고치면 판단 전체가 흔들리므로 쓰기를 막는다.
# 사람이 명시적으로 지시한 턴에서만 고친다.
# `.ai/project/` 의 기준 문서(scope·architecture·glossary·testing)와 역할·절차별 지시(`roles/`·`workflows/`)는 빠져도 항상 대상이다.
# 프로젝트 문서를 더하려면 여기 추가한다. 디렉터리는 `docs/spec/` 처럼 끝에 `/` 를 붙인다.
protected = [
  ".ai/project/scope.md",
  ".ai/project/architecture.md",
  ".ai/project/glossary.md",
  ".ai/project/testing.md",
]

# ─────────────────────────────────────────────────────────────────────────────
# 사용 기록
# ─────────────────────────────────────────────────────────────────────────────
[usage]
# 가드 차단·착수 판정·리뷰 회차만 남긴다. 명령 내용·문서 본문·사람 이름은 남기지 않는다.
# "off" 면 기록하지 않는다.
log_path = "$HOME/.harness/{project}/usage.log"
env_var = "HARNESS_USAGE_LOG"

# ─────────────────────────────────────────────────────────────────────────────
# 절차 (워크플로 체인)
# ─────────────────────────────────────────────────────────────────────────────
# 단계를 이어 `.ai/workflows/<이름>.md` 를 만든다. 순서를 바꾸고, 단계를 더하고 뺄 수 있다.
# 절차를 통째로 지우면 하네스 기본값으로 돌아간다.
#
#   id     단계 이름. `templates/workflows/<절차>/<id>.md` 조각이 있으면 그것이 본문이다
#   type   agent  = 역할에 위임 (role 필요 — 러너가 CLI 면 script/run-agent.py 로 따로 돈다)
#          script = 스크립트 실행 (run 필요 — 종료 코드가 0 이 아니면 멈춘다)
#          prompt = 오케스트레이터가 직접 수행 (조각이 없으면 text 필요)
#          gate   = 사람에게 올리고 답을 기다린다
#   title  단계 제목
#   text   본문에 덧붙일 지시. 조각이 없는 단계는 이것이 본문이다
#
# 조각은 다른 단계를 번호가 아니라 id 로 가리킨다. 가리켜진 단계를 빼면 render 가 막힌다.

[workflows.prework]
steps = [
  { id = "read-issue", type = "prompt", title = "이슈 읽기" },
  { id = "branch", type = "prompt", title = "브랜치" },
  { id = "analyze", type = "agent", title = "요구사항 검토", role = "requirement-analyzer" },
  { id = "decide", type = "gate", title = "결정 게이트" },
  { id = "spec", type = "agent", title = "명세", role = "spec-writer" },
  { id = "plan", type = "agent", title = "task 분해 + ADR + MR", role = "planner" },
  { id = "commit-mr", type = "prompt", title = "커밋·MR" },
  { id = "trace", type = "prompt", title = "결정 역추적" },
]

[workflows.work]
steps = [
  { id = "sync-tasks", type = "script", title = "task 이슈 동기화", run = "script/sync-task-issues.sh <Requirement 이슈번호>" },
  { id = "implement", type = "agent", title = "구현", role = "developer" },
  { id = "review", type = "script", title = "리뷰", run = "script/review-mr.sh <MR번호>" },
  { id = "branch", type = "prompt", title = "분기 — 종료 코드로만 한다" },
  { id = "limits", type = "prompt", title = "상한" },
]

[workflows.retro]
steps = [
  { id = "collect", type = "prompt", title = "수집 — 무엇이 기록되는가" },
  { id = "aggregate", type = "prompt", title = "집계 — 숫자는 스크립트만 센다" },
  { id = "signals", type = "prompt", title = "신호 → 원인 → 보완 대상" },
  { id = "report", type = "prompt", title = "보고" },
]
